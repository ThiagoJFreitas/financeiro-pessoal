{% extends "base.html" %}
{% block title %}Link enviado{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5"><div class="card-body p-4">
      <h4 class="mb-3"><i class="bi bi-envelope-check text-success"></i> Verifique seu e-mail</h4>
      <p>Se existir uma conta com esse e-mail, enviamos um link para redefinir a senha. Confira também a caixa de spam.</p>
      <p class="text-muted small">O link é válido por 24 horas.</p>
      <a href="{% url 'login' %}" class="btn btn-outline-secondary">Voltar para o login</a>
    </div></div>
  </div>
</div>
{% endblock %}
