{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="mb-3"><i class="bi bi-wallet2"></i> Financeiro Pessoal</h4>
        {% if form.errors %}<div class="alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}
        <form method="post">{% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <hr>
        <p class="text-center mb-0">Não tem conta? <a href="{% url 'register' %}">Cadastre-se</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
