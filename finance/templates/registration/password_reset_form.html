{% extends "base.html" %}
{% block title %}Esqueci a senha{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5"><div class="card-body p-4">
      <h4 class="mb-3">Esqueci minha senha</h4>
      <p class="text-muted">Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.</p>
      <form method="post">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <button class="btn btn-primary w-100">Enviar link de recuperação</button>
      </form>
      <hr>
      <p class="text-center mb-0"><a href="{% url 'login' %}">Voltar para o login</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
