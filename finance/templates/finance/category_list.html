{% extends "base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Categorias</h3>
  <a href="{% url 'category_create' %}" class="btn btn-success"><i class="bi bi-plus-lg"></i> Nova</a>
</div>
<div class="card shadow-sm">
  <table class="table mb-0">
    <thead class="table-light"><tr><th>Cor</th><th>Nome</th><th>Tipo</th><th></th></tr></thead>
    <tbody>
      {% for c in categories %}
      <tr>
        <td><span class="badge" style="background:{{ c.color }}">&nbsp;&nbsp;&nbsp;</span></td>
        <td>{{ c.name }}</td>
        <td>{{ c.get_kind_display }}</td>
        <td class="text-end">
          <a href="{% url 'category_edit' c.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
          <a href="{% url 'category_delete' c.pk %}" class="btn btn-sm btn-outline-danger">Excluir</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted py-3">Nenhuma categoria.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
