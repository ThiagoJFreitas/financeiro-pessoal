# Blueprint do Render: cria o banco Postgres + o web service de uma vez.
# No Render: New > Blueprint, aponte para este repositório e confirme.
databases:
  - name: financeiro-db
    plan: free

services:
  - type: web
    name: financeiro
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render gera uma chave secreta automaticamente
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: financeiro-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
